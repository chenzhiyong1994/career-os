        - statement: "沉淀 120 条合成评测样本"
          evidence_id: "proof-eval-sheet"
        - statement: "推动引用定位与无答案兜底进入正式版本"
          evidence_id: "proof-release-note"
      unverified_claims:
        - "最终节省的人工检索时长尚无可靠数据"

  projects:
